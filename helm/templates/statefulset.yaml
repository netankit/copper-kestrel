apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: searchd
  labels:
    app: searchd
spec:
  serviceName: searchd
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: searchd
  template:
    metadata:
      labels:
        app: searchd
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: searchd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SHARD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INDEX_LOAD_SECONDS
              value: "{{ .Values.env.indexLoadSeconds }}"
            - name: INGEST_ENABLED
              value: "{{ .Values.ingest.enabled }}"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: index
              mountPath: /var/lib/searchd
  volumeClaimTemplates:
    - metadata:
        name: index
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
